# ===== Рынок игроков (торговые точки) =====
# Тексты рынка. Вместо {i_stall}, {i_guard}, {i_robbery}, {i_star}, {i_closed}, {i_till}
# подставляются иконки из market.glyphs (по умолчанию монеты банкира и простые символы).
# 2026-10-14: какие тексты секции market идут через LoveNotify из LoveCore, решает код (NoticeRouting), а не этот файл.
# Событийные уведомления (статус клика в меню, сделка, аренда, ограбление) показываются в экшнбаре, а в чат
# попадают, если текст длиннее лимита LoveCore или уведомление критичное (деньги, потеря точки). Раньше они шли
# только в чат. Ответы NPC, ввод в чат, шаги мастера точек и команды остаются обычным чатом. Поэтому тексты
# событийных ключей лучше держать короткими, а у критичных сумма должна быть в самом тексте.
market:
  stall-rented: "{i_stall} <green>Торговая точка ваша.</green> <gray>Ваш торговец на месте: нажмите на него, чтобы разложить товар.</gray>"
  stall-released: "{i_stall} <yellow>Аренда точки закончилась.</yellow> <gray>Товары и деньги из кассы ждут вас в /tradepoint returns.</gray>"
  stall-vacant: "<gray>Здесь пока никто не торгует.</gray>"
  stall-closed: "{i_closed} <gray>Торговая точка закрыта.</gray>"
  rent-warning: "{i_stall} <yellow>Аренда точки закончится примерно через {hours} ч.</yellow> <gray>Оставьте деньги в кассе — продление спишется само.</gray>"
  rent-grace-closed: "{i_closed} <red>Аренда просрочена: торговая точка закрыта.</red> <gray>Пополните кассу — иначе точку <red>конфискуют</red> вместе с товарами.</gray>"
  rent-grace-reopened: "{i_stall} <green>Аренда оплачена — торговая точка снова открыта.</green>"
  shop-opened: "{i_stall} <green>Торговая точка открыта.</green>"
