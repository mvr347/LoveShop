prefix: "<gradient:#FF5555:#FFAA00>[LoveShops]</gradient> "

# 2026-10-19: версия языкового файла. copyDefaults не обновляет уже существующие строки, поэтому тексты меню,
# переписанные под стандарт gui-gen-6, не дошли бы до серверов со старым lang.yml. При переходе на новую версию
# LangMigrator берёт перечисленные разделы из jar заново (правки админа в них пропадают), а прежний файл
# сохраняется рядом как lang.yml.v<версия>.bak. Меняете оформление меню - поднимайте версию и добавляйте шаг в LangMigrator.
lang-version: 2

# 2026-10-19: общие куски оформления лора (стандарт gui-gen-6, RULE 10). Клики пишутся каждый на своей строке,
# перед ними всегда разделитель; цвет по ролям: ЛКМ зелёный, ПКМ золотой (красный - только для нехватки и запретов),
# Shift+... жёлтый. Значения читает LoreBlocks, а те же строки продублированы в самих списках lore ниже, чтобы файл
# читался как готовый предмет. GuiLoreStyleTest следит, что разделитель везде один и тот же.
style:
  separator: "<dark_gray><st>─────────────────────</st>"
  click:
    left: "<green>ЛКМ <dark_gray>— <gray>{action}"
    right: "<gold>ПКМ <dark_gray>— <gray>{action}"
    shift-left: "<yellow>Shift+ЛКМ <dark_gray>— <gray>{action}"
    shift-right: "<yellow>Shift+ПКМ <dark_gray>— <gray>{action}"
  # Неактивная кнопка: разделитель, статус, "Причина:", заблокированный клик - именно в таком порядке.
  reason: "<red>Причина: <gray>{reason}"
  blocked-click: "<dark_gray>{click} — {action} (заблокировано)"
  disabled-name: "<gray>{name} <dark_gray>| <red>Недоступно"
  status:
    unavailable: "<red>✕ Действие недоступно"
    locked: "<red>🔒 Заблокировано"
    cooldown: "<yellow>⌛ Подождите"
    # Единственное место, где в лоре допустим знак ✔: достигнут предел.
    max: "<green>✔ Достигнут предел"

commands:
  no-permission: "<red>У вас нет прав для выполнения этой команды!</red>"
  only-players: "<red>Эта команда предназначена только для игроков.</red>"
  unknown-subcommand: "<red>Неизвестная подкоманда. Используйте /loveshops help</red>"
  reload-success: "<green>Конфигурация и локализация плагина успешно перезагружены!</green>"
  npc-created: "<green>NPC типа <gold>{type}</gold> с именем <gold>{name}</gold> успешно создан!</green>"
  npc-deleted: "<green>NPC <gold>{name}</gold> был удалён.</green>"
  npc-not-looking: "<red>Вы должны смотреть на NPC для его удаления!</red>"
  buyer-status-set: "<green>Статус скупщика для игрока <gold>{player}</gold> установлен в <gold>{status}</gold>!</green>"
  invalid-status: "<red>Неверный статус! Допустимые значения: default, good, bad, aggressive</red>"
  # Единый формат для всех help-выводов плагина: разделитель, список
  # "<aqua>/команда аргументы</aqua> <gray>- описание</gray>", разделитель.
  admin-moved: "<yellow>Эта команда переехала: используйте <aqua>{command}</aqua>.</yellow>"
  help-header: "<dark_gray>========== <aqua>Помощь</aqua> ==========</dark_gray>"
  help-admin: "<aqua>/loveshopsadmin</aqua> <gray>- Административные команды</gray>"
  help-footer: "<dark_gray>=========================================</dark_gray>"

admin:
  help-header: "<dark_gray>========== <aqua>Админ</aqua> ==========</dark_gray>"
  help-reload: "<aqua>/loveshopsadmin reload</aqua> <gray>- Перезагрузить конфигурацию и локализацию</gray>"
  help-npc: "<aqua>/loveshopsadmin npc <create|delete|list></aqua> <gray>- Управление NPC-торговцами</gray>"
  help-footer: "<dark_gray>=========================================</dark_gray>"

