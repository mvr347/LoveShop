  invalid-status: "<red>Неверный статус! Допустимые значения: default, good, bad, aggressive</red>"
  # Единый формат для всех help-выводов плагина: разделитель, список
  # "<aqua>/команда аргументы</aqua> <gray>- описание</gray>", разделитель.
  admin-moved: "<yellow>Эта команда переехала: используйте <aqua>{command}</aqua>.</yellow>"
  help-header: "<dark_gray>========== <aqua>LoveShops Помощь</aqua> ==========</dark_gray>"
  help-open: "<aqua>/loveshops open <buyer|seller|auctioneer> [игрок]</aqua> <gray>- Открыть меню магазина</gray>"
  help-aliases: "<aqua>/buyer, /seller, /auction</aqua> <gray>- Быстрые алиасы для открытия меню</gray>"
  help-admin: "<aqua>/loveshopsadmin</aqua> <gray>- Административные команды LoveShops</gray>"
  help-footer: "<dark_gray>=========================================</dark_gray>"

admin:
  help-header: "<dark_gray>========== <aqua>LoveShops Admin</aqua> ==========</dark_gray>"
  help-reload: "<aqua>/loveshopsadmin reload</aqua> <gray>- Перезагрузить конфигурацию и локализацию</gray>"
  help-npc: "<aqua>/loveshopsadmin npc <create|delete|list></aqua> <gray>- Управление NPC-торговцами</gray>"
  help-buyer: "<aqua>/loveshopsadmin buyer <игрок> <статус> [сообщение]</aqua> <gray>- Статус игрока у скупщика</gray>"
  help-seller: "<aqua>/loveshopsadmin seller <start|stop|reset></aqua> <gray>- Управление событием барахолки</gray>"
  help-footer: "<dark_gray>=========================================</dark_gray>"

