# ===== ВАЛЮТА =====
# Валюта — общая для всей экосистемы, настраивается в LoveCore (economy.denominations
# в его config.yml), а не здесь. LoveShops требует LoveCore и без него не включится.


# ===== СКУПЩИК =====
buyer:
  enabled: true
  base-price-config:
    type: "config"                            # 'config' или 'nbt'
    default-price: 75                         # если не найдена в config (было 100, снижено на четверть — см. prices-config ниже)
  
  price-variance:
    min-percent: -30                          # минимальная вариативность
    max-percent: 30                           # максимальная вариативность
  
  repetition-penalty:
    enabled: true
    penalty-per-submit: 5                     # штраф % за каждую сдачу одинакового предмета
    max-penalty: 50                           # максимум штрафа (%)
  
  reputation-bonus:
    good-status: 20                           # + % к цене
    bad-status: -50                           # отказ в покупке
    aggressive-status: -30                    # отказ или сниженная цена
  
  messages:
    reject-bad-reputation:
      - "Скупщик: Про тебя ходят плохие слухи... Катись своей дорогой!"
      - "Скупщик: Мне не нравится твоё имя в городе. Уходи."
      - "Скупщик: С тобой лучше не иметь дел."
    reject-aggressive:
      - "Скупщик: Дружок, я не хочу проблем, иди своей дорогой."
      - "Скупщик: Твой агрессивный тон мне не нравится. Ступай!"
      - "Скупщик: Спокойнее! Или попросить у меня нечего."
    accept: "&aСкупщик: Отличный товар! Вот тебе &b{price} &aмонет!"
    accept-with-bonus: "&aСкупщик: У тебя хорошая репутация! Вот ещё &b{bonus} &aмонет сверху."

# ===== ТОРГОВЕЦ-БАРАХОЛКА =====
seller:
  enabled: true
  arrival-day: "SUNDAY"                       # день недели
  arrival-time: "10:00"                       # формат HH:MM (по серверному времени)
  departure-time: "18:00"
  min-items-to-spawn: 10                      # минимум предметов для прибытия торговца
  
  markup-percent: 15                          # базовая наценка на предметы от скупщика (%)

  dynamic-pricing:
    enabled: true
    demand-weight-percent: 3                  # + % к цене за каждую покупку предмета этого типа в текущем цикле
    supply-weight-percent: 2                  # - % к цене за каждую единицу этого типа сейчас в наличии
    noise-min-percent: -10                    # случайный шум цикла (мин)
    noise-max-percent: 10                     # случайный шум цикла (макс)
    min-multiplier: 0.3                       # минимальный итоговый множитель цены
    trend-threshold-percent: 5                # на сколько цена должна уйти от спокойной, чтобы в меню показать тренд

  messages:
    arrival:
      - "&e[Барахолка] &fТорговец приехал! &6Сейчас с 10:00 до 18:00."
      - "&e[Барахолка] &fВот это новый товар! Приходите покупать!"
    departure:
      - "&e[Барахолка] &fТорговец уезжает! Встретимся в следующее воскресенье."

# ===== АУКЦИОН (РЕДКИЕ ПРЕДМЕТЫ) =====
auctioneer:
  enabled: true
  auction-duration-hours: 24                  # длительность аукциона
  price-threshold: 400                        # цена скупки, начиная с которой предмет уходит на аукцион, а не на барахолку
  buyout-multiplier: 2.5                      # цена мгновенного выкупа = стартовая цена * множитель

  # Редкие/зачарованные предметы уходят на аукцион независимо от price-threshold выше.
  route-rare-items: true
  # Минимальная редкость (COMMON/UNCOMMON/RARE/EPIC, см. org.bukkit.inventory.ItemRarity),
  # начиная с которой предмет считается "редким" — фиолетово-золотистые цвета в тултипе ванильи.
  # Работает только для предметов, у которых явно проставлен компонент редкости; для
  # обычных зачарованных вещей без такого компонента срабатывает отдельная проверка на
  # зачарования (всегда включена, не зависит от этого порога).
  min-rarity: "RARE"

  anti-snipe:
    enabled: true
    threshold-seconds: 30                     # ставка позже этого времени до конца продлевает аукцион
    extension-seconds: 30                     # на сколько продлевать от момента ставки

  bid-step:
    type: "percentage"                        # 'percentage' или 'fixed'
    value: 5                                  # 5% от текущей ставки

  messages:
    auction-started: "&6Аукцион! &eПредмет: {item_name} &eна сумму {starting_price}"
    auction-ended: "&6Аукцион завершён! &eПобедитель: {winner} за {final_price}"
    bid-placed: "&a✓ Ставка принята: {bid_amount}"
    bid-outbid: "&c✗ Ваша ставка перебита на {new_amount}"

# ===== ЗАЩИТА И СИСТЕМНЫЕ ПАРАМЕТРЫ =====
protection:
  gui-update-on-purchase: true                # обновлять GUI по событию при покупке
  item-already-sold-message: "&cЭтот предмет уже куплен другим игроком."
  insufficient-funds: "&cНедостаточно средств!"

  
placeholders:
  enabled: true                               # включить PlaceholderAPI интеграцию

# ===== "ЖИВЫЕ" НПС: РЕАКЦИЯ НА ВЕЖЛИВОСТЬ/СТИЛЬ ИГРЫ (LoveBehavior) =====
# Срабатывает при клике на любого НПС (Скупщик/Барахолка/Аукционист), до открытия
# GUI. Это отдельный, более ранний слой поверх ручного /lssa status у Скупщика —
# тот статус (buyer_reputation_overrides) как проверялся, так и проверяется отдельно
# в момент финализации сделки Скупщика, здесь не участвует. Без LoveBehavior секция
# не действует (открытие GUI как раньше).
npc-dialogue:
  reject:
    enabled: true                             # блокировать открытие GUI для ужасной вежливости/агрессивного стиля
    terrible-politeness:
      - "Не люблю таких, как ты. Проваливай."
      - "О тебе слишком много говорят плохого. Уходи."
      - "С такими манерами тебе тут не рады."
    aggressive-playstyle:
      - "Спокойнее! Или у меня для тебя ничего нет."
      - "Твой агрессивный настрой мне не нравится. Ступай своей дорогой."
      - "Не хочу с тобой дел иметь — слишком буйный."
  ambient:
    enabled: true                             # необязательные фразы-настроение, не блокируют GUI
    chance: 0.35                              # шанс сказать фразу при открытии GUI
    terrible-politeness:
      - "*смотрит на тебя с презрением*"
      - "Ну и тип..."
    aggressive-playstyle:
      - "*настороженно косится*"
      - "Только без глупостей."
    friendly:
      - "О, рад тебя видеть!"
      - "С тобой всегда приятно иметь дело."
      - "Заходи почаще, доброму человеку тут всегда рады."

# ===== ПОЗИЦИИ ПРЕДМЕТОВ В CONFIG =====
# Базовые цены скупщика были срезаны примерно на 25% (владелец сервера сообщил, что
# скупщик отдаёт слишком много монет). Это самый прямой и предсказуемый рычаг: он
# действует до множителей variance/reputation-bonus/repetition-penalty ниже, так что
# соотношение между ними и итоговый разброс цены не меняются — меняется только база.
# Проверьте эти значения в игре и подправьте под свою экономику при необходимости.
# Обычные и редкие предметы теперь в отдельном файле prices.yml — см. common/rare там.
# Здесь остаются только клановые артефакты LoveClans: цена по типу, а не по материалу,
# им отдельный список не нужен. Выше порога аукциона (auctioneer.price-threshold),
# поэтому артефакт уходит на торги, а не на барахолку.
prices-config:
  artifacts:
    default-price: 1875
    WAR_HORN: 2250
    AEGIS_BANNER: 2625
