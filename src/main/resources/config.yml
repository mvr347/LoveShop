# ===== ВАЛЮТА =====
# Валюта — общая для всей экосистемы, настраивается в LoveCore (economy.denominations
# в его config.yml), а не здесь. LoveShops требует LoveCore и без него не включится.


# ===== NPC (привязка к Citizens) =====
npc:
  # Дальность луча взгляда для "/loveshopsadmin npc create|delete" без указания id: админ
  # создаёт и располагает NPC штатными командами Citizens, затем смотрит на него и привязывает
  # роль LoveShops этой командой - тот же паттерн, что уже используется в LoveClans
  # (ClansAdminCommand#createNpc) и LoveTweaks (Herald bind). Добавлено 2026-09-23 вместе
  # с переходом NpcManager на bindNpc(): LoveShops больше не создаёт и не удаляет сам Citizens
  # NPC, только помечает/снимает метку с уже существующего.
  bind-distance: 6.0



# ===== ЗАЩИТА И СИСТЕМНЫЕ ПАРАМЕТРЫ =====
protection:
  gui-update-on-purchase: true                # обновлять GUI по событию при покупке
  item-already-sold-message: "&cЭтот предмет уже куплен другим игроком."
  insufficient-funds: "&cНедостаточно средств!"

  
placeholders:
  enabled: true                               # включить PlaceholderAPI интеграцию

# ===== "ЖИВЫЕ" НПС: РЕАКЦИЯ НА ВЕЖЛИВОСТЬ/СТИЛЬ ИГРЫ (LoveBehavior) =====
# Срабатывает при клике на любого НПС (Скупщик/Военный торговец/Банкир/Странник), до открытия
# GUI. Это отдельный, более ранний слой поверх ручного /lssa status у Скупщика —
# тот статус (buyer_reputation_overrides) как проверялся, так и проверяется отдельно
# в момент финализации сделки Скупщика, здесь не участвует. Без LoveBehavior секция
# не действует (открытие GUI как раньше).
npc-dialogue:
  reject:
    enabled: true                             # блокировать открытие GUI для ужасной вежливости/агрессивного стиля
    terrible-politeness:
      - "Не люблю таких, как ты. Проваливай."
      - "О тебе слишком много говорят плохого. Уходи."
      - "С такими манерами тебе тут не рады."
    aggressive-playstyle:
      - "Спокойнее! Или у меня для тебя ничего нет."
      - "Твой агрессивный настрой мне не нравится. Ступай своей дорогой."
      - "Не хочу с тобой дел иметь — слишком буйный."
  ambient:
    enabled: true                             # необязательные фразы-настроение, не блокируют GUI
    chance: 0.35                              # шанс сказать фразу при открытии GUI
    terrible-politeness:
      - "*смотрит на тебя с презрением*"
      - "Ну и тип..."
    aggressive-playstyle:
      - "*настороженно косится*"
      - "Только без глупостей."
    friendly:
      - "О, рад тебя видеть!"
      - "С тобой всегда приятно иметь дело."
      - "Заходи почаще, доброму человеку тут всегда рады."

# ===== ВОЕННЫЙ ТОРГОВЕЦ (ТОЛЬКО ДЛЯ АГРЕССИВНОГО СТИЛЯ ИГРЫ) =====
# НПС нового типа "warmerchant" (создаётся через /loveshopsadmin npc create warmerchant <Имя>),
# ассортимент которого доступен только игрокам с достаточно агрессивным стилем игры
# (LoveCore.BehaviorLevels, ставит LoveBehavior). Как и остальная агрессивная механика в
# экосистеме (см. LoveClans war.aggressive-playstyle-bonus) - "агрессивный" значит НИЗКУЮ
# ступень playstyleLevel, не высокую. Без LoveBehavior доступа нет ни у кого.
war-merchant:
  enabled: true
  playstyle-threshold: 0
  messages:
    deny:
      - "Военный торговец: Тебе тут делать нечего, миролюбивый. Проваливай."
      - "Военный торговец: Это не для тебя. Здесь торгуют только с теми, кто не боится крови."
      - "Военный торговец: Возвращайся, когда перестанешь бояться сражений."
  # material - любой Material; price - цена в валюте LoveCore; enchantments - необязательная
  # карта ИМЯ_ЗАЧАРОВАНИЯ_В_ВЕРХНЕМ_РЕГИСТРЕ: уровень (те же ключи, что у /enchant и в loot-таблицах).
  items:
    - material: DIAMOND_SWORD
      price: 120
      enchantments: { SHARPNESS: 3, FIRE_ASPECT: 1 }
    - material: CROSSBOW
      price: 90
      enchantments: { QUICK_CHARGE: 2, PIERCING: 2 }
    - material: NETHERITE_AXE
      price: 220
      enchantments: { SHARPNESS: 2, UNBREAKING: 3 }
    - material: SHIELD
      price: 35
      enchantments: { }
    - material: TOTEM_OF_UNDYING
      price: 250
      enchantments: { }

# ===== НАЛОГ ТОРГОВЦЕВ (Скупщик/Военный торговец — БЕЗ Странника) =====
# 2026-09-24, по явной просьбе владельца: фиксированный процент, которым магазины LoveShop
# "съедают" часть каждой сделки - экономический сток / мера сохранения ценности золота на
# сервере. Скупщик платит игроку МЕНЬШЕ на этот процент; Военный торговец берёт с
# игрока БОЛЬШЕ на этот процент. Странник ИСКЛЮЧЁН СОЗНАТЕЛЬНО - владелец прямо попросил не
# трогать его цены этим налогом (см. wanderer.dynamic-pricing выше - у него своя, отдельная
# логика ценообразования).
#
# Это НЕ то же самое, что dev.lovelace.lovecore.api.economy.TaxOracle из LoveCore (секция tax:
# в конфиге LoveCore) - тот уже облагает налогом покупки/продажи экосистемно, по вежливости
# конкретного игрока, для любого плагина. Этот процент - независимый, ПОСТОЯННЫЙ (не зависит от
# поведения игрока) сток, который применяется ПОСЛЕ TaxOracle, поверх его результата (см.
# PriceCalculator#applyMerchantTaxToCost/applyMerchantTaxToPayout) - так поведенческий налог
# продолжает работать как раньше, а этот процент просто добавляет фиксированный слой сверху.
# 7% выбрано как заметный, но не разрушительный сток - владелец попросил диапазон 5-10%,
# середина диапазона взята как безопасный старт; поправить после недели наблюдений в игре.
merchant-tax:
  enabled: true
  percent: 7

# ===== ПОЗИЦИИ ПРЕДМЕТОВ В CONFIG =====
# Базовые цены скупщика были срезаны примерно на 25% (владелец сервера сообщил, что
# скупщик отдаёт слишком много монет). Это самый прямой и предсказуемый рычаг: он
# действует до множителей variance/reputation-bonus/repetition-penalty ниже, так что
# соотношение между ними и итоговый разброс цены не меняются — меняется только база.
# Проверьте эти значения в игре и подправьте под свою экономику при необходимости.
# Обычные предметы теперь в отдельном файле prices.yml — см. buyer там.
# Здесь остаются только клановые артефакты LoveClans: цена по типу, а не по материалу,
# им отдельный список не нужен.
prices-config:
  artifacts:
    default-price: 2500

# ===== БАНКИР =====
# Обмен физических монет LoveCore между номиналами (укрупнение / размен).
banker:
  enabled: true
  # Базовая комиссия в % при укрупнении/размене (7%). Округление в пользу сервера.
  # Персональная: /loveshopsadmin banker fee <игрок> <0-100>
  # Сброс к базовой: /loveshopsadmin banker fee <игрок> reset
  fee-percent: 7
  dialogues:
    greeting:
      - "<gold>[Банкир]</gold> <gray>Приветствую! Звонкая монета всегда в цене. Желаете разменять или укрупнить капитал?</gray>"
      - "<gold>[Банкир]</gold> <gray>Добро пожаловать в хранилище. Все номиналы в наличии, комиссия минимальна!</gray>"
      - "<gold>[Банкир]</gold> <gray>Деньги любят счёт и порядок. Выкладывайте монеты на стол — всё пересчитаем без обмана.</gray>"
    dismiss:
      - "<red>[Банкир]</red> <gray>С такими сомнительными личностями я дел не веду. Убирайтесь от сейфа!</gray>"
      - "<red>[Банкир]</red> <gray>Охрана! Следите за этим типом. Никаких операций для вас сегодня!</gray>"
      - "<red>[Банкир]</red> <gray>Твоя дурная репутация идёт впереди тебя. Я не доверяю свои сундуки подозрительным бродягам.</gray>"
    close:
      - "<gold>[Банкир]</gold> <gray>Всего доброго! Не забывайте свои монеты, берегите сбережения.</gray>"
      - "<gold>[Банкир]</gold> <gray>Удачных сделок! Возвращайтесь, если потребуется размен.</gray>"
    error:
      - "<red>[Банкир]</red> <gray>Здесь какая-то ошибка в расчётах. Проверьте сумму на столе.</gray>"
      - "<red>[Банкир]</red> <gray>Не хватает монет с учётом комиссии. Положите больше средств.</gray>"

# ===== ОСОБЫЙ ТОРГОВЕЦ (СТРАННИК) =====
wanderer:
  enabled: true
  name: "Странник"
  display-name: "<gradient:#9b59b6:#e74c3c><bold>Странник</bold></gradient>"
  skin-owner: "Wanderer"

  # Расписание появления. 2026-09-23: раньше это были 3 ЖЁСТКО заданных дня недели
  # (TUESDAY/THURSDAY/SATURDAY) — теперь Странник каждый день бросает кубик, приходить ли
  # ему сегодня (вероятность = arrivals-per-week/7), с одним жёстким правилом: не два дня
  # подряд (см. WandererManager#isTodayArrivalDay). arrivals-per-week — средняя частота в
  # неделю, а не гарантированное число визитов.
  schedule:
    arrivals-per-week: 3
    arrival-time: "10:00"                       # формат HH:MM
    departure-time: "22:00"

  # Точечные "визиты" вместо общего оповещения о приходе (см. messages ниже — оповещение
  # убрано по требованию). Странник сам решает, кому лично намекнуть о своём визите — это
  # ТОЛЬКО предвзятость выбора получателя приватного сообщения, а не право торговать (это
  # отдельно решает playstyle-requirement выше) и не связано с фичей "агрессивный стиль
  # открывает секретные сделки", которую отдельно делают на стороне LoveBehavior.
  # 2026-09-26: выключено по умолчанию — владелец попросил, чтобы Странник вообще не показывал
  # текст при появлении (сюда же relates departure-enabled ниже, про уход).
  visit-targeting:
    enabled: false
    # Игрок классифицируется как "агрессивный/конфликтный", если LoveCore.BehaviorLevels
    # .playstyleLevel(uuid) <= этого порога (0 = максимально агрессивный стиль, 6 = максимально
    # добрый, см. BehaviorLevels.MAX_LEVEL). Неаггрессивные (выше порога) визит получают всегда.
    aggressive-threshold: 2
    # Конфликтный игрок всё ещё может получить личный визит Странника, но только с этим
    # шансом (0..1) — Странник предпочитает спокойных игроков, но не игнорирует агрессивных
    # полностью.
    aggressive-consider-chance: 0.5
    messages:
      - "<dark_purple>[Странник]</dark_purple> <white>Кто-то тихо стучит в дверь твоего дома... Таинственный Странник заглянул в город и ищет встречи именно с тобой.</white>"
      - "<dark_purple>[Странник]</dark_purple> <white>Из тени у рынка тебе едва заметно кивает знакомый силуэт с капюшоном...</white>"

  # Настройки договора (заказа предметов)
  deal:
    cost: 30                                    # Стоимость заключения договора (0 = бесплатно)
    delivery-time-minutes: 60                   # Через сколько минут Странник принесёт предметы
    min-items: 3                                # Минимальное кол-во предметов в приносе
    max-items: 6                                # Максимальное кол-во предметов в приносе
    deal-expire-hours: 48                       # Сколько часов сохраняются принесённые товары

    # Платный персональный заказ: игрок платит доплату и получает партию, собранную ТОЛЬКО
    # из предметов запрошенной категории (item-pool.category ниже), вместо случайного набора
    # из всего пула. Категории: TOOLS (Инструменты), ARMOR (Броня), ENCHANTMENTS (Зачарования —
    # зачарованные книги), RARE (Редкие предметы).
    personal-request:
      enabled: true
      surcharge-percent: 50                     # доплата % к deal.cost за выбор конкретной категории

  # Динамическое ценообразование Странника по экономике недели (2026-09-24, просьба владельца).
  # Множитель цены считается на КАЖДЫЙ новый договор (WandererManager#computeDynamicPriceMultiplier)
  # из двух сигналов за последние 7 дней и применяется к price каждого предмета из items-pool ниже.
  # Множитель ТОЛЬКО повышает цену (никогда не опускает её ниже 1.0) - владелец просил именно
  # "выше при дефиците/активности", а не симметричную скидку в обратную сторону.
  #   1) scarcity (дефицит, основной сигнал) - сколько предметов игроки продали Скупщику за
  #      неделю (buyer_inventory.received_at). Мало продаж = дефицит товаров = Странник дороже.
  #      При weeklySold >= scarcity-reference-weekly-sold бонус равен нулю (рынок и так насыщен).
  #   2) activity (активность экономики, вторичный сигнал, слабее scarcity по просьбе владельца) -
  #      сколько разных игроков за неделю продавали Скупщику ИЛИ покупали на рынке
  #      (buyer_inventory + market_transactions). Богатая/активная экономика выдерживает цены повыше.
  # Оба веса и порог насыщения независимо настраиваются - шаблон значений ниже: 50 продаж/неделю
  # и 20 активных игроков/неделю взяты как "обычная неделя" по объёму органично играющего сервера
  # среднего размера; поправить под свой сервер после недели наблюдений в /loveshopsadmin.
  dynamic-pricing:
    enabled: true
    scarcity-weight-percent: 40                 # макс. надбавка % от дефицита (при weeklySold = 0)
    scarcity-reference-weekly-sold: 50          # "нормальная" неделя продаж Скупщику - выше неё бонуса нет
    activity-weight-percent: 15                 # макс. надбавка % от активности (меньше scarcity — так просил владелец)
    activity-reference-weekly-players: 20       # "нормальное" число активных игроков в неделю - выше него бонус не растёт
    max-multiplier: 1.75                        # потолок множителя (scarcity+activity вместе), чтобы цена не улетела в абсурд

  # Реалистичное качество товара Странника (2026-09-23): раньше предметы всегда приходили
  # с полной прочностью и полным набором зачарований из конфига — выглядело неестественно
  # "сгенерированным". Теперь оба свойства бросаются отдельно на каждый предмет.
  item-quality:
    durability:
      enabled: true
      pristine-chance: 0.35                     # шанс прийти без износа вообще
      min-wear-percent: 5                       # если износ есть — мин. % потерянной прочности
      max-wear-percent: 60                      # макс. % потерянной прочности
    enchant-quality:
      # Зачарования Странника намеренно ЛУЧШЕ обычного дропа: даже "худший" ролл (без
      # зачарований) применяется только к товарам, которые уже отобраны вручную как
      # "Wanderer-уровня" в items-pool — потолок качества всё равно выше рядового лута.
      enabled: true
      full-enchant-chance: 0.65                 # шанс сохранить ВСЕ зачарования как в конфиге
      partial-enchant-chance: 0.25              # шанс оставить только сильнейшую половину
      # оставшийся шанс (1 - full - partial) = без зачарований на этом ролле

  # Требование к стилю игры LoveBehavior
  playstyle-requirement:
    enabled: true
    required-style: "aggressive"                # Требуемый стиль: aggressive
    playstyle-threshold: 0                      # Порог в LoveCore.BehaviorLevels (0 = максимальная агрессия)

  messages:
    not-aggressive:
      - "<red>Странник:</red> <gray>Ты выглядишь слишком мирным... Я веду дела только с теми, у кого агрессивный стиль игры. Возвращайся, когда прольёшь чью-то кровь.</gray>"
      - "<red>Странник:</red> <gray>Мои товары — не для слабаков. Твой стиль слишком мягок. Мне нужны бойцы и агрессоры.</gray>"
      - "<red>Странник:</red> <gray>Уходи. Я торгую только с безжалостными хищниками.</gray>"
    not-active:
      - "<dark_purple>Странник:</dark_purple> <gray>Сейчас я в дальнем пути. Моё расписание не знает даже город — приходи и проверь!</gray>"
    deal-started: "<green>Странник:</green> <gray>По рукам! Я отправляюсь в путь за редким добром. Вернусь через <gold>{time}</gold>.</gray>"
    deal-not-ready: "<yellow>Странник:</yellow> <gray>Я ещё не вернулся с полными руками. Жди меня через <gold>{time}</gold>.</gray>"
    deal-ready: "<green>Странник:</green> <gray>Я вернулся и принёс отличные вещи! Выбирай, пока не разобрали.</gray>"
    deal-completed: "<green>Странник:</green> <gray>Сделка завершена. Хочешь заказать новую партию?</gray>"
    insufficient-funds-deal: "<red>У вас недостаточно средств для заключения сделки! Требуется: <gold>{currency_icon}{cost} {currency}</gold></red>"
    # arrival: намеренно убран — Странник больше не объявляет о своём приходе на весь сервер,
    # см. visit-targeting выше (приватные "визиты" вместо общего оповещения).
    # 2026-09-26: departure-enabled по умолчанию false — владелец попросил, чтобы Странник не
    # показывал текст и при уходе тоже (см. visit-targeting.enabled выше про приход). Список
    # departure ниже сохранён на случай, если это захотят включить обратно.
    departure-enabled: false
    departure:
      - "<dark_purple>[Странник]</dark_purple> <gray>Странник собрал пожитки и растворился в ночи. Встретимся в следующий раз...</gray>"

  dialogues:
    greeting:
      - "<dark_purple>[Странник]</dark_purple> <gray>Тише... Я принёс диковинки из далёких земель, каких в этих краях ещё не видали.</gray>"
      - "<dark_purple>[Странник]</dark_purple> <gray>Дороги были опасны, но товар того стоит. Взгляни, путник, пока я не ушёл дальше.</gray>"
      - "<dark_purple>[Странник]</dark_purple> <gray>Шёпот ветров привёл меня сюда. Ищешь нечто особенное? Загляни в мой мешок.</gray>"
    dismiss:
      - "<dark_purple>[Странник]</dark_purple> <gray>От тебя разит бедой. Я странствую не для того, чтобы связываться со слабаками или бандитами. Прочь!</gray>"
      - "<dark_purple>[Странник]</dark_purple> <gray>Мои товары не для тебя. Скройся с глаз, пока я не растворился в тенях.</gray>"
      - "<dark_purple>[Странник]</dark_purple> <gray>Не подходи! Чутьё никогда не подводило меня — от тебя не жди добра.</gray>"
    close:
      - "<dark_purple>[Странник]</dark_purple> <gray>Ветер снова зовёт меня в дорогу... До новой встречи, если судьбе будет угодно.</gray>"
