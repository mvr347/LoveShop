      price: 1500
      amount: 1
      weight: 20

    - id: "predator_crossbow"
      material: "CROSSBOW"
      name: "<gold><bold>Арбалет Хищника</bold></gold>"
      lore:
        - "<gray>Выпускает град смертоносных стрел.</gray>"
      enchants:
        QUICK_CHARGE: 3
