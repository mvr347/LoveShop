# Плановая очистка базы (раз в сутки).
maintenance:
  # 2026-10-03: закрытые сессии потерянных грузов, завершённые визиты караванщика, проданные и снятые
  # лоты комиссионера (с историей) копились в БД бесконечно: каждый лот хранит предмет в base64, а все
  # проверки (участие, лимит сдачи) читают эти таблицы. 60 дней хватает, чтобы разобрать спор по сделке;
  # меньше 7 дней не берётся (значение ниже поднимается до 7).
  history-retention-days: 60
