# ===== РЫНОК ИГРОКОВ (торговые точки) =====
# Работает при наличии Citizens и LoveClaims (плот превращается в точку командой
# /rental admin settype <плот> trade_point). Значения — заготовки от 2026-09-30,
# подбираются по экономике сервера.
market:
  enabled: true

  rent:
    # 2026-10-02. Напоминания арендатору о конце аренды. Раньше было одно предупреждение за сутки
    # (из LoveClaims) и без слов о конфискации: торговцы узнавали о потере точки постфактум.
    # Теперь несколько ступеней: за 3 суток есть время накопить на продление, за сутки и за 6 ч —
    # последний шанс, за 1 ч — срочно. Больше ступеней раздражало бы чат, меньше — не успевали.
    reminders-enabled: true
    reminder-hours: [72, 24, 6, 1]
    # Если аренда уже просрочена (точка закрыта, идёт льготный срок), напоминать раз в N минут:
    # 180 = раз в 3 часа, чтобы не спамить, но и не дать забыть, что точку конфискуют.
    grace-reminder-minutes: 180

  stalls:
    # 5+5 — торговцу есть с чего начать, но выбор ограничен: рост слотов даёт смысл прокачке.
    base-sell-slots: 5
    base-buy-slots: 5
    base-storage-stacks: 20
    storage-per-level: 5
    # 2026-10-03. 0 = максимум считается сам: уровень, на котором полок столько же, сколько мест
    # в самом большом (54-слотовом) меню (21). Число больше 0 может только понизить потолок.
    max-level: 0
    allow-sell-only: true
    allow-buy-only: true
    # Максимум штук в одном заказе на скупку: защита от заказов на «весь сервер».
    max-buy-amount: 4096
    # Покупка на такую сумму и выше идёт через окно подтверждения — от случайного клика по дорогому лоту.
    confirm-threshold: 5000
    # Сделка, зависшая в журнале дольше этого (сек), считается прерванной сбоем и разбирается сверкой.
    pending-timeout-seconds: 30
    # 2026-10-03. Цена улучшения считается в самых крупных монетах LoveEconomy (по умолчанию незеритовых):
    # первое улучшение стоит upgrade-cost-coins монет, каждое следующее на upgrade-cost-step-coins больше
    # (1, 2, 3 ... монет). Линейный рост, потому что слоты тоже растут по одному за уровень: цена
    # понятна заранее, а полный максимум (16 улучшений = 136 монет) остаётся долгой целью.
    upgrade-cost-coins: 1
    upgrade-cost-step-coins: 1

  npc:
    # 2026-10-03. Надпись над торговцем: строки формата сверху вниз, {id} — имя плота (его задаёт админ),
    # {owner} — ник арендатора. Под ними — статус точки (ник NPC), он меняется сам. Цвета через &.
    name-format: "&6Торговая точка №{id}\n&fВладелец: &e{owner}"
    # Режим включён, а лотов нет (ни выставленных товаров, ни заказов) — игрок сразу видит, что торговать нечем.
    status-empty: "&7Нет лотов"
    status-open: "&aОткрыто"
    status-closed: "&cЗакрыто"
    status-sell-only: "&eВитрина"
    status-buy-only: "&bСкупка"
    status-robbed: "&4[ОГРАБЛЕНО]"
    particles: false
    ambient-sounds: false
    look-close: true
    guard-name: "&9Стража"
    guard-skin: ""
    # 2026-10-02. «Феодал» — NPC, у которого арендуют торговые точки, возвращают их и нанимают стражу.
    # Создаётся командой /tradepointadmin npc create seller.
    feudal-name: "&6Феодал"
    feudal-skin: ""

  # Табличка с id точки (ставится мастером /tradepointadmin create). {id} — имя точки,
  # {status} — «Свободна» или ник арендатора (обновляется само).
  id-sign:
    lines:
      - "&6Торговая точка"
      - "&f{id}"
      - "{status}"
      - "&7Аренда у Феодала"

  feudal:
    # 2026-10-02. Сколько процентов неистёкшей аренды возвращается, если игрок отдаёт точку Феодалу:
    # 50% — выгоднее продлевать, чем «арендовать и сдать», но и потеря не обидная при смене планов.
    refund-percent: 50
    # Недельная аренда новой точки, если админ не указал цену в /tradepointadmin create <id> [цена].
    # 100 — стартовая цена в единицах LoveEconomy; меняется командой /tradepointadmin price <id> <цена>.
    default-rent-price: 100

  # Кого рынок обслуживает — по шкалам LoveBehavior (вежливость 0..6: 0 ужасно; стиль 0..6: 0 агрессивный).
  gates:
    enabled: true
    # Вежливость не выше — «изгой»: не арендует, торговцы его прогоняют. 1 = «Ужасно» и «Плохо», как в налоге LoveCore.
    outcast-max-politeness: 1
    # Стиль игры не выше — «агрессор» (порог тот же, что у Странника): не арендует, торгует редко.
    aggressive-max-playstyle: 2
    # Налог не берётся, если вежливость не ниже этого И стиль не ниже следующего — «идеальная» репутация.
    perfect-min-politeness: 6
    good-min-playstyle: 5
    # Шанс, что торговец просто прогонит агрессора, — 3 из 4: торгует он «редко», но не «никогда».
    aggressor-refuse-chance: 0.75

  tax:
    # Налог платит продавец с выручки, ставка — TaxOracle#tradeRate (по вежливости и стилю игры). Удержанное сгорает.
    enabled: true
    exempt-perfect: true

  rating:
    # Оценить можно только после сделок на эту сумму: без покупки оценка — просто слив рейтинга.
    min-trade-amount: 500
    # Повторно оценить тот же магазин — не чаще, иначе оценку можно менять под настроение каждый день.
    cooldown-hours: 48
    # Свежий аккаунт весит меньше: рейтинги накручивают новыми аккаунтами.
    new-account-days: 7
    new-account-weight: 0.3
    max-comment-length: 100

  robbery:
    # Ограбление палаток агрессорами (только палатки игроков; серверные NPC не грабятся).
    enabled: true
    # Шанс на первом клике за «день» — 1%: одиночный клик почти безопасен, ограбление — итог настойчивости.
    base-chance: 0.01
    # +0,5% за каждый следующий клик того же дня: «чем чаще, тем выше», но понемногу.
    step: 0.005
    chance-cap: 0.20
    # Бюджет кликов в день. Не выпало за 12 — сегодня не выпадет: бесконечный спам ничего не даёт (~37% за день).
    attempts-per-day: 12
    # «День» доставания начинается в 4:00 серверного времени, а не в полночь: вечерняя сессия — один день.
    day-reset-hour: 4
    # Несколько агрессоров в течение этих минут считаются нападающими вместе: шанс 1−∏(1−p), но не 100%.
    co-attack-window-minutes: 15
    max-combined-chance: 0.90
    # Не больше двух ограблений одной точки за день — иначе группа выжмет кассу, пока владелец спит.
    max-robberies-per-point-per-day: 2
    max-robberies-per-day: 3
    # Добыча — либо деньги, либо вещи (не всё сразу).
    coins-chance: 0.5
    max-till-percent: 15
    max-stock-percent: 10
    max-items: 8
    robbery-cooldown-hours: 6
    hostility-minutes: 30
    # Штраф вежливости грабителю (ReputationOracle#modify).
    robbery-reputation-penalty: 5

  guard:
    enabled: true
    cost-per-day: 1
    durations-days: [1, 3, 7, 14]
    # Слишком настойчивых выводят с рынка (не с сервера): 5 кликов за 10 минут — бан на точку на 30 минут.
    harassment-limit: 5
    harassment-window-minutes: 10
    harassment-ban-minutes: 30

  blacklist:
    max-entries: 32

  discount:
    max-percent: 50

  closed-sign:
    remove-on-open: true
    lines:
      - "&cТорговая точка"
      - "&cзакрыта"
      - "{owner}"
      - ""

  # Куда отправляют нарушителей. Не задан или мира нет — только бан на точку, без телепорта.
  exit:
    world: "world"
    x: 0
    y: 64
    z: 0


  prompt:
    # Столько секунд даётся на ввод цены в чат: дольше — игрок забыл, промпт не должен висеть вечно.
    timeout-seconds: 60

  price:
    # Потолок любой цены: с ним сумма сделки (цена x количество) не переполняет long.
