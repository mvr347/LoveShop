# ===== ВАЛЮТА И ИНТЕГРАЦИЯ =====
currency:
  type: "itemsadder"                          # 'itemsadder', 'executableitems', or 'vault'
  currency-item: "copper_coin"                # ID фоллбек кастомного предмета
  currency-display-name: "Монеты"             # Название для сообщений
  itemsadder-coins:
    copper_coin: 1
    iron_coin: 10
    gold_coin: 100
    diamond_coin: 1000
    netherite_coin: 10000


# ===== СКУПЩИК =====
buyer:
  enabled: true
  base-price-config:
    type: "config"                            # 'config' или 'nbt'
    default-price: 100                        # если не найдена в config
  
  price-variance:
    min-percent: -30                          # минимальная вариативность
    max-percent: 30                           # максимальная вариативность
  
  repetition-penalty:
    enabled: true
    penalty-per-submit: 5                     # штраф % за каждую сдачу одинакового предмета
    max-penalty: 50                           # максимум штрафа (%)
  
  reputation-bonus:
    good-status: 20                           # + % к цене
    bad-status: -50                           # отказ в покупке
    aggressive-status: -30                    # отказ или сниженная цена
  
  messages:
    reject-bad-reputation:
      - "Скупщик: Про тебя ходят плохие слухи... Катись своей дорогой!"
      - "Скупщик: Мне не нравится твоё имя в городе. Уходи."
      - "Скупщик: С тобой лучше не иметь дел."
    reject-aggressive:
      - "Скупщик: Дружок, я не хочу проблем, иди своей дорогой."
      - "Скупщик: Твой агрессивный тон мне не нравится. Ступай!"
      - "Скупщик: Спокойнее! Или попросить у меня нечего."
    accept: "&aСкупщик: Отличный товар! Вот тебе &b{price} &aмонет!"
    accept-with-bonus: "&aСкупщик: У тебя хорошая репутация! Вот ещё &b{bonus} &aмонет сверху."

# ===== ТОРГОВЕЦ-БАРАХОЛКА =====
seller:
  enabled: true
  arrival-day: "SUNDAY"                       # день недели
  arrival-time: "10:00"                       # формат HH:MM (по серверному времени)
  departure-time: "18:00"
  min-items-to-spawn: 10                      # минимум предметов для прибытия торговца
  
  markup-percent: 15                          # базовая наценка на предметы от скупщика (%)

  dynamic-pricing:
    enabled: true
    demand-weight-percent: 3                  # + % к цене за каждую покупку предмета этого типа в текущем цикле
    supply-weight-percent: 2                  # - % к цене за каждую единицу этого типа сейчас в наличии
    noise-min-percent: -10                    # случайный шум цикла (мин)
    noise-max-percent: 10                     # случайный шум цикла (макс)
    min-multiplier: 0.3                       # минимальный итоговый множитель цены

  messages:
    arrival:
      - "&e[Барахолка] &fТорговец приехал! &6Сейчас с 10:00 до 18:00."
      - "&e[Барахолка] &fВот это новый товар! Приходите покупать!"
    departure:
      - "&e[Барахолка] &fТорговец уезжает! Встретимся в следующее воскресенье."

# ===== АУКЦИОН (РЕДКИЕ ПРЕДМЕТЫ) =====
auctioneer:
  enabled: true
  auction-duration-hours: 24                  # длительность аукциона
  price-threshold: 400                        # цена скупки, начиная с которой предмет уходит на аукцион, а не на барахолку
  buyout-multiplier: 2.5                      # цена мгновенного выкупа = стартовая цена * множитель

  bid-step:
    type: "percentage"                        # 'percentage' или 'fixed'
    value: 5                                  # 5% от текущей ставки

  messages:
    auction-started: "&6Аукцион! &eПредмет: {item_name} &eна сумму {starting_price}"
    auction-ended: "&6Аукцион завершён! &eПобедитель: {winner} за {final_price}"
    bid-placed: "&a✓ Ставка принята: {bid_amount}"
    bid-outbid: "&c✗ Ваша ставка перебита на {new_amount}"

# ===== ЗАЩИТА И СИСТЕМНЫЕ ПАРАМЕТРЫ =====
protection:
  gui-update-on-purchase: true                # обновлять GUI по событию при покупке
  item-already-sold-message: "&cЭтот предмет уже куплен другим игроком."
  insufficient-funds: "&cНедостаточно средств!"
  inventory-full-sell-message: "&cУ вас нет свободного места в инвентаре для получения монет!"
  inventory-full-buy-message: "&cВаш инвентарь заполнен! Освободите место для товара."

  
placeholders:
  enabled: true                               # включить PlaceholderAPI интеграцию

# ===== ПОЗИЦИИ ПРЕДМЕТОВ В CONFIG =====
prices-config:
  DIAMOND: 500
  GOLD_INGOT: 150
  IRON_INGOT: 50
  EMERALD: 300
  NETHERITE_INGOT: 2000
  COPPER_INGOT: 25
  AMETHYST_SHARD: 75
  LAPIS_LAZULI: 40
  QUARTZ: 35
  REDSTONE: 20

# ===== ОСОБЫЙ ТОРГОВЕЦ (СТРАННИК) =====
wanderer:
  enabled: true
  name: "Странник"
  display-name: "<gradient:#9b59b6:#e74c3c><bold>Странник</bold></gradient>"
  skin-owner: "Wanderer"

  # Расписание появления: 3 раза в неделю
  schedule:
    days:
      - "TUESDAY"
      - "THURSDAY"
      - "SATURDAY"
    arrival-time: "10:00"                       # формат HH:MM
    departure-time: "22:00"

  # Настройки договора (заказа предметов)
  deal:
    cost: 150                                   # Стоимость заключения договора (0 = бесплатно)
    delivery-time-minutes: 60                   # Через сколько минут Странник принесёт предметы
    min-items: 3                                # Минимальное кол-во предметов в приносе
    max-items: 6                                # Максимальное кол-во предметов в приносе
    deal-expire-hours: 48                       # Сколько часов сохраняются принесённые товары

  # Требование к стилю игры LoveBehavior
  playstyle-requirement:
    enabled: true
    required-style: "aggressive"                # Требуемый стиль: aggressive

  messages:
    not-aggressive:
      - "<red>Странник:</red> <gray>Ты выглядишь слишком мирным... Я веду дела только с теми, у кого агрессивный стиль игры. Возвращайся, когда прольёшь чью-то кровь.</gray>"
      - "<red>Странник:</red> <gray>Мои товары — не для слабаков. Твой стиль слишком мягок. Мне нужны бойцы и агрессоры.</gray>"
      - "<red>Странник:</red> <gray>Уходи. Я торгую только с безжалостными хищниками.</gray>"
    not-active:
      - "<dark_purple>Странник:</dark_purple> <gray>Сейчас я в дальнем пути. Я бываю в городе только по вторникам, четвергам и субботам!</gray>"
    deal-started: "<green>Странник:</green> <gray>По рукам! Я отправляюсь в путь за редким добром. Вернусь через <gold>{time}</gold>.</gray>"
    deal-not-ready: "<yellow>Странник:</yellow> <gray>Я ещё не вернулся с полными руками. Жди меня через <gold>{time}</gold>.</gray>"
    deal-ready: "<green>Странник:</green> <gray>Я вернулся и принёс отличные вещи! Выбирай, пока не разобрали.</gray>"
    deal-completed: "<green>Странник:</green> <gray>Сделка завершена. Хочешь заказать новую партию?</gray>"
    insufficient-funds-deal: "<red>У вас недостаточно средств для заключения сделки! Требуется: <gold>{cost} {currency}</gold></red>"
    arrival:
      - "<dark_purple>[Странник]</dark_purple> <white>Таинственный Странник прибыл в город! Он ищет тех, кто не боится пролить кровь...</white>"
    departure:
      - "<dark_purple>[Странник]</dark_purple> <gray>Странник собрал пожитки и растворился в ночи. Встретимся в следующий раз...</gray>"

  # Пул предметов, которые может принести Странник
  items-pool:
    - id: "blood_sword"
      material: "NETHERITE_SWORD"
      name: "<red><bold>Клинок Кровавого Странника</bold></red>"
      lore:
        - "<gray>Заточен в пламени Преисподней.</gray>"
        - "<dark_red>Оружие безжалостного завоевателя.</dark_red>"
      enchants:
        SHARPNESS: 5
        FIRE_ASPECT: 2
