name: LoveShops
version: 1.0.0
main: dev.lovelace.loveshops.LoveShops
api-version: '26.2'
description: Advanced trading system with NPC merchants and player trade points
author: Lovelace

softdepend:
  - LoveBehavior
  - PlaceholderAPI
  - ItemsAdder
  - Citizens
  - LoveCore
  - LoveBrewing
  - LoveClaims

commands:
  loveshops:
    description: LoveShops main administration and trading command
    aliases: [shops, шоп, loveshop, lshops, lshop, auction, auctioneer, wanderer]
    usage: /loveshops <subcommand>
  loveshopsadmin:
    description: Административные команды LoveShops (npc, item, event, point, banker, auction)
    aliases: [lsa, lspa, lssa]
    usage: /loveshopsadmin <subcommand>
  tradepoint:
    description: Управление торговой точкой игрока
    aliases: [point, точка]
    usage: /tradepoint <returns|transfer|blacklist|discount|mode>

permissions:
  loveshops.admin.point:
    description: Moderate trade points (/loveshopsadmin point)
    default: op
  loveshops.admin:
    description: Access to all LoveShops admin commands
    default: op
  loveshops.admin.create:
    description: Create NPC merchant
    default: op
  loveshops.admin.delete:
    description: Delete NPC merchant
    default: op
  loveshops.admin.wanderer:
    description: 'Manage Wanderer merchant (/loveshopsadmin event wanderer)'
    default: op
  loveshops.wanderer.bypass:
    description: Bypass aggressive playstyle requirement for Wanderer
    default: op
  loveshops.admin.reload:
    description: Reload plugin configuration
    default: op
  loveshops.admin.open:
    description: Open shop GUI menus by command (self or for another player) — without it, the command produces no output at all
    default: op
  loveshops.admin.price:
    description: Set the price of the item held in hand
    default: op
  loveshops.admin.rarity:
    description: Set the rarity of the item held in hand
    default: op
  loveshops.admin.auction:
    description: Moderate auction lots (/loveshopsadmin auction)
    default: op
  loveshops.admin.market:
    description: Close, open, seize trade points and restore robberies (/loveshopsadmin point)
    default: op
  loveshops.admin.forbidden:
    description: Forbid/allow selling the item held in hand
    default: op
