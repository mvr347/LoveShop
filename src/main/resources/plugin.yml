name: LoveShops
version: 1.0.0
main: dev.lovelace.loveshops.LoveShops
api-version: '26.2'
description: Advanced trading system with NPC merchants (Buyer, Seller, Auctioneer)
author: Lovelace

softdepend:
  - LoveBehavior
  - PlaceholderAPI
  - ItemsAdder
  - Citizens
  - LoveCore
  - LoveBrewing

commands:
  loveshops:
    description: LoveShops main administration and trading command
    aliases: [shops, шоп, loveshop, lshops, lshop, buyer, seller, auction, auctioneer]
    usage: /loveshops <subcommand>
  loveshopsadmin:
    description: Административные команды LoveShops (reload, npc, buyer, seller)
    usage: /loveshopsadmin <subcommand>

permissions:
  loveshops.admin:
    description: Access to all LoveShops admin commands
    default: op
  loveshops.admin.create:
    description: Create NPC merchant
    default: op
  loveshops.admin.delete:
    description: Delete NPC merchant
    default: op
  loveshops.admin.buyer:
    description: Set player buyer status override
    default: op
  loveshops.admin.seller:
    description: Force-control the Seller (Барахолка) event schedule
    default: op
  loveshops.admin.reload:
    description: Reload plugin configuration
    default: op
  loveshops.admin.open:
    description: Open GUI menu for specified player
    default: op
