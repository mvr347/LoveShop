name: LoveShops
version: 1.0.0
main: dev.lovelace.loveshops.LoveShops
api-version: '26.2'
description: Advanced trading system with NPC merchants (Buyer, Seller, Auctioneer)
author: Lovelace

softdepend:
  - LoveBehavior
  - PlaceholderAPI
  - ItemsAdder
  - Citizens
  - LoveCore
  - LoveBrewing

commands:
  loveshops:
    description: LoveShops main administration and trading command
    aliases: [shops, шоп, loveshop, lshops, lshop, buyer, seller, auction, auctioneer, wanderer]
    usage: /loveshops <subcommand>
  loveshopsadmin:
    description: Административные команды LoveShops (npc, status, item, event)
    aliases: [lspa, lssa]
    usage: /loveshopsadmin <subcommand>

permissions:
  loveshops.admin:
    description: Access to all LoveShops admin commands
    default: op
  loveshops.admin.create:
    description: Create NPC merchant
    default: op
  loveshops.admin.delete:
    description: Delete NPC merchant
    default: op
  loveshops.admin.status:
    description: 'Set player buyer status override (/loveshopsadmin status)'
    default: op
  loveshops.admin.seller:
    description: 'Force-control the flea market event schedule (/loveshopsadmin event flea)'
    default: op
  loveshops.admin.wanderer:
    description: 'Manage Wanderer merchant (/loveshopsadmin event wanderer)'
    default: op
  loveshops.wanderer.bypass:
    description: Bypass aggressive playstyle requirement for Wanderer
    default: op
  loveshops.admin.reload:
    description: Reload plugin configuration
    default: op
  loveshops.admin.open:
    description: Open shop GUI menus by command (self or for another player) — without it, the command produces no output at all
    default: op
  loveshops.admin.price:
    description: Set the price of the item held in hand
    default: op
  loveshops.admin.rarity:
    description: Set the rarity of the item held in hand
    default: op
  loveshops.admin.forbidden:
    description: Forbid/allow selling the item held in hand
    default: op
