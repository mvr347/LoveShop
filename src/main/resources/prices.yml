# ==============================================================================
# LoveShops - Единый конфигурационный файл цен для торговцев и NPC
# ==============================================================================
# Здесь настраиваются базовые цены для всех торговцев сервера.
#
# Настройка через внутриигровые команды:
# - /loveshopsadmin price <buyer|seller|war_merchant|wanderer|auctioneer|all> <цена>
#   (устанавливает цену для предмета в руке)
# - /loveshopsadmin price <buyer|seller|war_merchant|wanderer|auctioneer|all> <материал/id> <цена>
#   (устанавливает цену по имени материала или ID предмета Странника)
#
# Экономический баланс:
# - Мусор и строительные блоки: 1-2 монеты
# - Сельхоз и еда: 1-3 монеты
# - Дроп монстров: 1-6 монет (Слеза гаста: 15)
# - Минералы и слитки: 2-50 монет (Незеритовый слиток: 100)
# - Обычные инструменты и броня: 10-95 монет
# - Потолок скупки Скупщика ~ 100 монет (1 алмазная монета)
# - Редкие, зачарованные и легендарные предметы уходят на Аукцион или продаются Странником.
# ==============================================================================

