# ==============================================================================
# LoveShops - переопределения цен торговцев (prices.yml)
# ==============================================================================
# 2026-10-03: цены больше НЕ задаются списком на 300 предметов. Базовую цену предмета считает модель цен LoveCore
# (по рецептам: цена изделия = стоимость сырья по рецепту × (1 + наценка за крафт); см. /lovecoreadmin economy price
# <предмет> и /lovecoreadmin economy dump-prices). Этот файл — только ПЕРЕОПРЕДЕЛЕНИЯ: запись здесь выигрывает
# у модели. Прежний файл (цены под старые номиналы, потолок ~100) при первом запуске сохранён как
# prices.yml.pre-economy-v2 и заменён этим.
#
# Настройка через внутриигровые команды:
# - /loveshopsadmin price <buyer|war_merchant|wanderer|all> <цена>
#   (устанавливает цену для предмета в руке)
# - /loveshopsadmin price <buyer|war_merchant|wanderer|all> <материал/id> <цена>
# - /lsa price ... reset — снять переопределение (цена снова считается по модели)
#
# Цены — в медных единицах (медная 1, железная 100, золотая 2 000, алмазная 20 000).
# ==============================================================================
scale-version: 2

# 1. СКУПЩИК (buyer): сколько платит игроку за единицу. Пусто = по модели × buyer.payout-percent.
buyer: {}

# 2. ВОЕННЫЙ ТОРГОВЕЦ (war_merchant): цена товара. Пусто = цена из config.yml × war-merchant.price-scale,
#    но не ниже стоимости по модели × war-merchant.markup-percent.
war_merchant: {}

# 3. СТРАННИК (wanderer): цена товара по id пула или материалу. Пусто = как у военного торговца (wanderer.*).
wanderer: {}
