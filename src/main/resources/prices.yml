# ==========================================
#   LoveShops — цены скупщика (prices.yml)
# ==========================================
# Вынесено из config.yml в отдельный файл, чтобы правки баланса цен не путались с
# остальными настройками плагина. Перезагружается вместе с остальным конфигом
# (/loveshopsadmin reload).

# Обычные предметы: цена скупки по материалу. Редактируется вручную или командой
# /loveshopsadmin price <сумма> (держа предмет в руке) — если у материала нет метки
# редкости ниже, цена меняется здесь.
common:
  DIAMOND: 375
  GOLD_INGOT: 112
  IRON_INGOT: 38
  EMERALD: 225
  NETHERITE_INGOT: 1500
  COPPER_INGOT: 19
  AMETHYST_SHARD: 56
  LAPIS_LAZULI: 30
  QUARTZ: 26
  REDSTONE: 15

# Редкие предметы: ручная метка поверх автоматического определения редкости
# (org.bukkit.inventory.ItemRarity и зачарования, см. PriceCalculator#isRareItem).
#
#   rare: true   — принудительно считать материал редким (уходит на аукцион), даже
#                  если авто-проверка его не заметила.
#   rare: false  — принудительно ИСКЛЮЧИТЬ материал из авто-определения, даже если
#                  он зачарован или несёт компонент редкости (например, авто-проверка
#                  ошибочно посчитала что-то редким).
#   price        — стартовая цена лота на аукционе для этого материала вместо цены
#                  по формуле. Необязательно — без неё используется обычная формула.
#
# Заполняется командами /loveshopsadmin rarity <common|uncommon|rare|epic> и
# /loveshopsadmin price <сумма> (обе — держа предмет в руке).
rare: {}
  # Пример:
  # NETHERITE_SWORD:
  #   rare: true
  #   price: 1000
